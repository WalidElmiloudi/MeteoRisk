services:

  postgres_data:
    image: postgres:15-alpine
    container_name: postgres_data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Root1234
      POSTGRES_DB: weather
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_airflow:
    image: postgres:15-alpine
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow:/var/lib/postgresql/data

  airflow:
    image: apache/airflow:3.0.6
    container_name: airflow
    depends_on:
      - postgres_airflow
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

  streamlit:
    build: ./dashboard
    container_name: streamlit
    depends_on:
      - postgres_data
    environment:
      DB_URL : postgresql://postgres:Root1234@postgres_data:5432/weather
    ports:
      - "8501:8501"

volumes:
  postgres_data:
  postgres_airflow:
